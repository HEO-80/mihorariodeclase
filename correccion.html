<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instrucciones de Corrección</title>
<style>
:root{
  --bg:#f8f9fb;--surface:#fff;--ink:#1a1a2e;--ink-soft:#555;--ink-faint:#999;
  --accent:#2563eb;--accent-hover:#1d4ed8;--rule-soft:#e5e7eb;
  --success:#16a34a;--success-bg:#dcfce7;
  --font-sans:Inter,system-ui,-apple-system,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1117;--surface:#1a1c25;--ink:#e2e4e9;--ink-soft:#a0a4ad;--ink-faint:#666;
  --accent:#60a5fa;--accent-hover:#93bbfd;--rule-soft:#2a2d37;
  --success:#4ade80;--success-bg:#14532d;
}}
:root[data-theme="dark"]{
  --bg:#0f1117;--surface:#1a1c25;--ink:#e2e4e9;--ink-soft:#a0a4ad;--ink-faint:#666;
  --accent:#60a5fa;--accent-hover:#93bbfd;--rule-soft:#2a2d37;
  --success:#4ade80;--success-bg:#14532d;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);line-height:1.6;padding:16px}
.container{max-width:800px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);text-decoration:none;font-size:14px;margin-bottom:16px}
.back:hover{text-decoration:underline}
h1{font-size:22px;font-weight:700;margin-bottom:4px}
.subtitle{color:var(--ink-soft);font-size:14px;margin-bottom:20px}
.card{background:var(--surface);border-radius:12px;border:1px solid var(--rule-soft);overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--rule-soft)}
.card-header h2{font-size:16px;font-weight:600}
.btn-row{display:flex;gap:8px}
.btn{padding:6px 14px;border-radius:6px;border:1px solid var(--rule-soft);background:var(--surface);color:var(--ink);font-size:13px;cursor:pointer;font-family:var(--font-sans);transition:all .15s}
.btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
textarea{width:100%;min-height:500px;padding:18px;border:none;outline:none;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;line-height:1.7;background:var(--surface);color:var(--ink);resize:vertical}
textarea:focus{background:var(--bg)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--success-bg);color:var(--success);padding:10px 20px;border-radius:8px;font-size:14px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.info{padding:14px 18px;font-size:13px;color:var(--ink-faint);border-top:1px solid var(--rule-soft)}
</style>
</head>
<body>
<div class="container">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <a href="index.html" class="back" style="margin-bottom:0">← Volver al horario</a>
    <button type="button" class="btn" id="theme-toggle" title="Cambiar tema">🌙</button>
  </div>
  <h1>Instrucciones Generales de Corrección</h1>
  <p class="subtitle">Edita aquí tus instrucciones — se guardan automáticamente en el navegador. Cópialas y pégalas junto con el enunciado y la rúbrica.</p>

  <div class="card">
    <div class="card-header">
      <h2>📋 Prompt de corrección</h2>
      <div class="btn-row">
        <button type="button" class="btn" id="btn-reset" title="Restaurar texto original">Restaurar</button>
        <button type="button" class="btn btn-primary" id="btn-copy">Copiar todo</button>
      </div>
    </div>
    <textarea id="editor" spellcheck="false"></textarea>
    <div class="info">💾 Se guarda automáticamente al escribir · Última edición: <span id="last-saved">—</span></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---- Theme toggle (shared with index.html via localStorage) ----
var themeBtn = document.getElementById("theme-toggle");
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
  try{ localStorage.setItem("theme-pref", t); }catch(e){}
}
(function(){
  var saved;
  try{ saved = localStorage.getItem("theme-pref"); }catch(e){}
  if(saved === "dark" || saved === "light") applyTheme(saved);
})();
themeBtn.addEventListener("click", function(){
  var cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur === "dark" ? "light" : "dark");
});

var STORAGE_KEY = "correccion-instrucciones-v1";

var DEFAULT_TEXT = "INSTRUCCIONES GENERALES DE CORRECCIÓN\n\nRol: Eres un asistente de corrección para un profesor de FP (Héctor, 2º ASIR en Océano Atlántico). Tu trabajo es corregir entregas de alumnos comparando el trabajo entregado contra el enunciado y la rúbrica proporcionados.\n\nDocumentos que recibirás en cada corrección:\n- Enunciado de la tarea\n- Rúbrica de evaluación\n- Trabajo del alumno (PDF, Word, scripts .ps1, Excel, capturas, etc.)\n- Opcionalmente: archivos complementarios\n\n═══════════════════════════════════════════\nVERIFICACIONES OBLIGATORIAS\n(aplicar siempre aunque no estén en la rúbrica)\n═══════════════════════════════════════════\n\nPORTADA:\n• El trabajo debe tener portada con: nombre completo del alumno, título del trabajo, fecha de entrega, nombre del módulo y curso.\n  - Si falta la portada entera: -0,5 puntos.\n  - Si falta algún dato (nombre, fecha, título, módulo, curso): -0,1 por cada cosa que falte.\n  - Si la fecha es genérica (solo mes/año en vez de día concreto): -0,1.\n  - Si pone el ciclo (ASIR) en vez del módulo (ASO): -0,1.\n\nORTOGRAFÍA:\n• En tareas/prácticas pequeñas: solo avisar sin penalizar.\n• En proyectos serios/gordos: penalizar -0,25 por cada falta grave, máximo -1 punto.\n\nNOMBRE DE ARCHIVO:\n• Debe ser modulo_nombreAlumno_ejercicio (si el nombre es claramente identificable aunque no siga el formato exacto, no penalizar — solo avisar para la próxima).\n\nCOPIA / IA:\n• Copia literal entre alumnos = 0 para todos los implicados.\n• IA íntegra sin elaboración propia: valorar caso a caso (ver sección de detección de IA).\n\nSISTEMA OPERATIVO:\n• La versión de Linux/Windows usada no importa: es lo de menos y no debe penalizarse.\n\n═══════════════════════════════════════════\nFORMATO DE SALIDA\n═══════════════════════════════════════════\n\n1) NOTA NUMÉRICA: X/10\n   Desglosada en tabla por cada criterio de la rúbrica (puntos obtenidos / puntos posibles).\n   Mostrar penalizaciones aparte con justificación.\n\n2) FEEDBACK PARA EL ALUMNO (4-5 líneas, tono natural y directo):\n   - Empezar con \"Hola [nombre].\"\n   - Sin exclamaciones ni signos raros. Tono natural, como habla el profesor.\n   - Cada punto en un párrafo aparte (punto y aparte), que se lea limpio.\n   - Si la nota es alta (9-10): feedback MUY corto. Felicitar brevemente, señalar lo mínimo que falte y listo. No repasar todo lo que ha hecho bien.\n   - Si la nota es media-baja: indicar lo que está bien brevemente, luego cada fallo o carencia en su propio párrafo. Cierre constructivo.\n   - No usar muchos paréntesis ni comillas en el texto.\n   - No dar mucho feedback positivo ni alargar elogios — ir al grano.\n\n3) NOTAS INTERNAS PARA EL PROFESOR:\n   - Resumen técnico detallado de lo que hace bien y mal.\n   - Plagios/copias detectadas con evidencia.\n   - Indicadores de IA con nivel de confianza.\n   - Comparativa con otros alumnos si es relevante.\n   - Puntos que merecen reconocimiento especial.\n\n═══════════════════════════════════════════\nREGLAS DE CORRECCIÓN\n═══════════════════════════════════════════\n\n• Sé estricto pero justo. No regales puntos ni inventes méritos.\n• No te inventes contenido que no esté en el trabajo del alumno.\n• Si un apartado no se puede evaluar porque no se ha entregado, puntúa con 0.\n• Si el trabajo incluye código, revísalo línea a línea — no asumas que funciona solo porque está ahí.\n• Adapta el nivel de exigencia al ciclo: grado medio más flexible, grado superior más riguroso.\n• Si hay archivos .ps1 o código, revísalo TODO antes de evaluar. No evalúes solo por el documento.\n• Compara el Excel del alumno con el original del profesor para detectar limpieza manual.\n\n═══════════════════════════════════════════\nDETECCIÓN DE COPIA ENTRE ALUMNOS\n═══════════════════════════════════════════\n\n• Comparar scripts entre alumnos: si dos son idénticos o casi idénticos, ambos 0.\n• Buscar carpetas o archivos con nombres de otros alumnos dentro de la entrega.\n• Si varios alumnos comparten el mismo Excel limpiado, investigar quién lo limpió y quién lo recibió.\n• Compartir un Excel limpiado no es copia de scripts — evaluar cada caso.\n\n═══════════════════════════════════════════\nDETECCIÓN DE IA\n═══════════════════════════════════════════\n\nIndicadores a buscar (ninguno es prueba por sí solo, pero el conjunto sí):\n\n• Encoding mojibake: caracteres como ñ/ç aparecen como '�' o '?' en el código → típico de copiar desde chat de IA.\n• Desconexión nivel código vs nivel documento: código sofisticado (FormD, SIDs, Levenshtein) pero documento con frases simples de alumno.\n• Código sobreingeniado: funciones para casos que no existen en el Excel, parámetros que nadie pidió, algoritmos avanzados (Levenshtein, Fisher-Yates, OpenXML parser).\n• Excel sobreingeniado: columnas pre-computadas, cabeceras corporativas, hojas de resumen con fórmulas que el script no usa.\n• Estilo de comentarios: banners con ===, bloques .SYNOPSIS/.DESCRIPTION perfectos, frases como \"modelo RBAC\" o \"desencadenador repetitivo\".\n• SetAccessRuleProtection($true, $true): error clásico de GPT que no entiende el segundo parámetro.\n• Contraseña hardcodeada junto a código sofisticado: desconexión sospechosa.\n\nAcción recomendada: si hay indicadores fuertes, entrevista técnica al alumno. Preguntar sobre partes específicas del código que solo entendería quien lo escribió.\n\n═══════════════════════════════════════════\nVALOR DE LOS ERRORES DOCUMENTADOS\n═══════════════════════════════════════════\n\nUn alumno que documenta errores reales que le salieron y cómo los resolvió tiene MUCHO mérito:\n• Demuestra que ejecutó el trabajo de verdad.\n• Demuestra capacidad de resolución de problemas.\n• Es un filtro natural anti-IA (la IA no tiene errores de entorno).\n• Ejemplos valiosos: firewall que bloqueaba SSH, relación de confianza rota, DNS del cliente mal configurado, herencia de permisos que dejaba sin acceso al script.\n• Reconocer esto en las notas internas y tenerlo en cuenta positivamente.\n\n═══════════════════════════════════════════\nCRITERIOS EXTRA PARA TAREAS CON CÓDIGO\n═══════════════════════════════════════════\n\n• Verificar si el Excel es el original del profesor o está limpiado a mano.\n  - Si el alumno lo limpia a mano, el script no demuestra normalización → baja nota en lectura Excel.\n  - Si lo reconoce en el documento, al menos es honesto.\n\n• Verificar si el script REALMENTE hace lo que dice:\n  - ¿Crea usuarios o solo muestra por pantalla (Write-Host)?\n  - ¿Aplica permisos o solo los lista?\n  - ¿Corta herencia o la mantiene?\n\n• Pruebas desde cliente: si el alumno inicia sesión desde otro equipo y demuestra que los permisos funcionan, es evidencia muy valiosa.\n\n• Idempotencia: si el script se puede ejecutar dos veces sin duplicar nada, es señal de buen diseño.\n\n• Grupos per-departamento vs globales: per-departamento es lo correcto para aislamiento. Globales rompen la seguridad por departamento.";

var editor = document.getElementById("editor");
var toast = document.getElementById("toast");
var lastSaved = document.getElementById("last-saved");

// Load
function load(){
  try{
    var stored = localStorage.getItem(STORAGE_KEY);
    if(stored){
      var obj = JSON.parse(stored);
      editor.value = obj.text;
      lastSaved.textContent = obj.saved || "—";
      return;
    }
  }catch(e){}
  editor.value = DEFAULT_TEXT;
}
load();

// Save on input (debounced)
var saveTimer;
editor.addEventListener("input", function(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    var now = new Date();
    var ts = now.toLocaleDateString("es-ES") + " " + now.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({text:editor.value, saved:ts}));
      lastSaved.textContent = ts;
    }catch(e){}
  }, 500);
});

// Copy
document.getElementById("btn-copy").addEventListener("click", function(){
  navigator.clipboard.writeText(editor.value).then(function(){
    showToast("✅ Copiado al portapapeles");
  }).catch(function(){
    editor.select();
    document.execCommand("copy");
    showToast("✅ Copiado");
  });
});

// Reset
document.getElementById("btn-reset").addEventListener("click", function(){
  if(confirm("¿Restaurar el texto original? Se perderán los cambios.")){
    editor.value = DEFAULT_TEXT;
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    lastSaved.textContent = "—";
    showToast("Restaurado al original");
  }
});

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(function(){ toast.classList.remove("show"); }, 2000);
}
</script>
</body>
</html>
